
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFChat | Screenshots</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .showcase {
      width: 100%;
      max-width: 1050px;
      text-align: center;
    }

    .brand {
      color: #a78bfa;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(28px, 5vw, 44px);
    }

    .description {
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .viewer {
      padding: 16px;
      border: 1px solid #29344d;
      border-radius: 20px;
      background: #131b2e;
      box-shadow: 0 24px 70px #0005;
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      text-align: left;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
    }

    .counter {
      color: #c4b5fd;
      font-size: 14px;
      white-space: nowrap;
    }

    .screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      overflow: hidden;
      border-radius: 12px;
      background: #080c16;
    }

    .screen img {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }

    button {
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 18px;
      color: #f8fafc;
      background: #202b42;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #6d4aff;
      border-color: #8b5cf6;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .progress {
      height: 4px;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 10px;
      background: #29344d;
    }

    .progress-bar {
      height: 100%;
      width: 14.2857%;
      background: #a78bfa;
      transition: width 0.25s ease;
    }

    .hint {
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body {
        padding: 24px 12px;
      }

      .viewer {
        padding: 10px;
      }

      button {
        padding: 10px;
      }

      .page-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="showcase">
    <div class="brand">PDFChat · Application Tour</div>
    <h1>Explore PDFChat</h1>
    <p class="description">
      Take a look at the interface, from document uploads
      to AI-powered conversations.
    </p>

    <section class="viewer" aria-label="Application screenshot slideshow">
      <div class="viewer-header">
        <div class="page-title" id="page-title">Home Page</div>
        <div class="counter" id="counter">Page 1 / 7</div>
      </div>

      <div class="screen">
        <img
          id="screenshot"
          src="assets/home_page.png"
          alt="PDFChat home page"
        >
      </div>

      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="controls">
        <button id="previous" type="button" disabled>
          ← Previous
        </button>

        <button id="next" type="button">
          Next →
        </button>
      </div>
    </section>

    <p class="hint">
      Use the navigation buttons or your keyboard's arrow keys.
    </p>
  </main>

  <script>
    const pages = [
      {
        title: "Home Page",
        image: "assets/home_page.png",
        alt: "PDFChat home page"
      },
      {
        title: "Login Page",
        image: "assets/login_page.png",
        alt: "User login page"
      },
      {
        title: "Register Page",
        image: "assets/register_page.png",
        alt: "User registration page"
      },
      {
        title: "Uploaded Files",
        image: "assets/uploaded_files.png",
        alt: "User's uploaded documents"
      },
      {
        title: "Upload File",
        image: "assets/upload_file.png",
        alt: "Document upload page"
      },
      {
        title: "Conversations",
        image: "assets/conversations.png",
        alt: "User conversations page"
      },
      {
        title: "Chat Page",
        image: "assets/chat.png",
        alt: "Chat interface for document questions"
      }
    ];

    let currentPage = 0;

    const screenshot = document.getElementById("screenshot");
    const title = document.getElementById("page-title");
    const counter = document.getElementById("counter");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const progress = document.getElementById("progress-bar");

    function showPage(index) {
      currentPage = index;
      const page = pages[currentPage];

      screenshot.src = page.image;
      screenshot.alt = page.alt;
      title.textContent = page.title;
      counter.textContent =
        `Page ${currentPage + 1} / ${pages.length}`;

      previous.disabled = currentPage === 0;
      next.disabled = currentPage === pages.length - 1;

      progress.style.width =
        `${((currentPage + 1) / pages.length) * 100}%`;
    }

    previous.addEventListener("click", () => {
      if (currentPage > 0) {
        showPage(currentPage - 1);
      }
    });

    next.addEventListener("click", () => {
      if (currentPage < pages.length - 1) {
        showPage(currentPage + 1);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" && currentPage > 0) {
        showPage(currentPage - 1);
      }

      if (
        event.key === "ArrowRight" &&
        currentPage < pages.length - 1
      ) {
        showPage(currentPage + 1);
      }
    });
  </script>
</body>
</html>
